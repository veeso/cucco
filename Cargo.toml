[package]
name = "cucco"
version = "3.4.0"
authors = [
  "Christian Visintin <christian.visintin@veeso.dev>",
  "Finley Thomalla <finley@thomalla.ch>",
  "Danny Tatom <its.danny@hey.com>",
]
categories = ["command-line-utilities", "development-tools"]
documentation = "https://docs.rs/cucco"
edition = "2021"
homepage = "https://github.com/veeso/cucco"
include = [
  "/CHANGELOG.md",
  "/Cargo.lock",
  "/Cargo.toml",
  "/LICENSE",
  "/README.md",
  "/meta/config/default.toml",
  "/src/**",
]
keywords = ["cli", "commit", "conventional-commits", "git", "hooks"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/veeso/cucco"
rust-version = "1.98.1"
description = "An interactive CLI for creating conventional commits, with git hooks support."

[features]
ast-grep = ["dep:ast-grep-config", "dep:ast-grep-language"]
default = ["ast-grep"]

[dependencies]
anyhow = "1"
ast-grep-config = { version = "0.45", optional = true }
ast-grep-language = { version = "0.45", optional = true }
clap = { version = "4", features = ["derive"] }
clap_complete_command = { version = "0.6", features = ["nushell"] }
cocogitto = { version = "7", default-features = false }
config = { version = "0.15", features = ["toml"] }
conventional_commit_parser = "0.9"
dirs = "6"
emojis = "0.9"
gix = "0.86"
indexmap = "2"
inquire = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
xdg = "3"

[dev-dependencies]
assert_cmd = "2"
git2 = "0.21"
predicates = "3"
tempfile = "3"

[target.'cfg(not(windows))'.dev-dependencies]
rexpect = "0.7"

[lib]
name = "cucco"
path = "src/lib/lib.rs"

[[bin]]
name = "cucco"
path = "src/bin/main.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[profile.release]
opt-level = "z"
codegen-units = 1
