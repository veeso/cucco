name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 4.0.0 (no leading v)"
        required: true
        type: string
      dry_run:
        description: "Dry run: build and compute everything, push and publish nothing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ inputs.version }}
      prepared_ref: ${{ steps.prepared-ref.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_PAT }}
          persist-credentials: true
          fetch-depth: 0
          fetch-tags: true

      - name: Validate version and branch
        env:
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "invalid release version: $VERSION (expected MAJOR.MINOR.PATCH)" >&2
            exit 2
          fi
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Releases must run from $DEFAULT_BRANCH."
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v$VERSION"; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name "veeso"
          git config user.email "christian.visintin@veeso.dev"

      - name: Install git-cliff and dprint
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: git-cliff,dprint

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0

      - name: Bump version
        env:
          VERSION: ${{ inputs.version }}
        run: just bump_version "$VERSION"

      - name: Generate CHANGELOG
        env:
          VERSION: ${{ inputs.version }}
        run: just changelog "$VERSION"

      - name: Generate release notes
        env:
          VERSION: ${{ inputs.version }}
        run: git-cliff --config cliff.toml --unreleased --tag "v$VERSION" --strip header -o RELEASE_NOTES.md

      - name: Verify only the package version moved in Cargo.lock
        run: |
          changed=$(git diff --unified=0 -- Cargo.lock | grep -c '^[+-]version = ' || true)
          echo "changed version lines in Cargo.lock: $changed"
          if [ "$changed" -gt 2 ]; then
            echo "cargo update --workspace touched more than the package version" >&2
            git --no-pager diff -- Cargo.lock >&2
            exit 1
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 1
          if-no-files-found: error

      - name: Show diff (dry run)
        if: ${{ inputs.dry_run }}
        run: git --no-pager diff

      - name: Commit and push version bump
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          rm -f RELEASE_NOTES.md
          git add -A
          git commit -m "chore: release v$VERSION"
          git push origin HEAD:main

      - name: Export prepared ref
        id: prepared-ref
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    name: build-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            kind: linux
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            kind: linux
          - target: aarch64-apple-darwin
            os: macos-latest
            kind: macos
          - target: x86_64-apple-darwin
            os: macos-latest
            kind: macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            kind: windows
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            kind: windows
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.prepared_ref }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0

      - name: Prepare release version
        shell: bash
        run: |
          just bump_version "$VERSION"
          cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Install Rust target (posix)
        if: matrix.kind != 'windows'
        run: rustup target add "$TARGET"

      - name: Install Rust target (windows)
        if: matrix.kind == 'windows'
        run: rustup target add "$env:TARGET"

      - name: Build (Linux, static musl)
        if: matrix.kind == 'linux'
        run: just build_musl "$TARGET"

      - name: Build (macOS)
        if: matrix.kind == 'macos'
        run: just build_release "$TARGET"

      - name: Build (Windows)
        if: matrix.kind == 'windows'
        run: just build_release "$env:TARGET"

      - name: Package (posix)
        if: matrix.kind != 'windows'
        run: |
          mkdir -p artifact
          cp "target/$TARGET/release/cucco" artifact/cucco
          asset="cucco-v$VERSION-$TARGET.tar.gz"
          tar -czf "artifact/$asset" -C artifact cucco
          shasum -a 256 "artifact/$asset" | awk '{print $1}' > "artifact/$asset.sha256"
          rm artifact/cucco

      - name: Package (windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item "target/$env:TARGET/release/cucco.exe" artifact/cucco.exe
          $asset = "cucco-v$env:VERSION-$env:TARGET.zip"
          Compress-Archive -Path artifact/cucco.exe -DestinationPath "artifact/$asset"
          (Get-FileHash "artifact/$asset" -Algorithm SHA256).Hash.ToLower() | Out-File -NoNewline "artifact/$asset.sha256"
          Remove-Item artifact/cucco.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.target }}
          path: artifact/*
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_PAT }}
          ref: ${{ needs.prepare.outputs.prepared_ref }}
          persist-credentials: true

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          path: dl
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: notes

      - name: Assemble release assets
        run: |
          mkdir -p out
          cp dl/*.tar.gz dl/*.zip dl/*.sha256 out/
          cp install.sh install.ps1 out/
          ls -la out

      - name: Upload assets artifact (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-dryrun
          path: out/*
          retention-days: 3

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh release create "v$VERSION" out/* \
            --title "v$VERSION" \
            --notes-file notes/RELEASE_NOTES.md

  publish-crate:
    needs: [prepare, release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Authenticate through crates.io trusted publishing.
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.prepared_ref }}
          persist-credentials: false

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0

      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: just publish

  publish-homebrew:
    needs: [prepare, build, release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          path: dl
          merge-multiple: true

      - name: Checkout homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: veeso/homebrew-cucco
          token: ${{ secrets.RELEASE_PAT }}
          path: tap
          persist-credentials: true

      - name: Rewrite formula
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          SHA_MAC_ARM=$(cat "dl/cucco-v$VERSION-aarch64-apple-darwin.tar.gz.sha256")
          SHA_MAC_X64=$(cat "dl/cucco-v$VERSION-x86_64-apple-darwin.tar.gz.sha256")
          SHA_LIN_ARM=$(cat "dl/cucco-v$VERSION-aarch64-unknown-linux-musl.tar.gz.sha256")
          SHA_LIN_X64=$(cat "dl/cucco-v$VERSION-x86_64-unknown-linux-musl.tar.gz.sha256")
          BASE="https://github.com/veeso/cucco/releases/download/v$VERSION"
          mkdir -p tap/Formula
          cat > tap/Formula/cucco.rb <<EOF
          class Cucco < Formula
            desc "Interactive CLI for creating conventional commits, with git hooks support"
            homepage "https://github.com/veeso/cucco"
            license "MIT"
            version "$VERSION"

            on_macos do
              on_arm do
                url "$BASE/cucco-v$VERSION-aarch64-apple-darwin.tar.gz"
                sha256 "$SHA_MAC_ARM"
              end
              on_intel do
                url "$BASE/cucco-v$VERSION-x86_64-apple-darwin.tar.gz"
                sha256 "$SHA_MAC_X64"
              end
            end

            on_linux do
              on_arm do
                url "$BASE/cucco-v$VERSION-aarch64-unknown-linux-musl.tar.gz"
                sha256 "$SHA_LIN_ARM"
              end
              on_intel do
                url "$BASE/cucco-v$VERSION-x86_64-unknown-linux-musl.tar.gz"
                sha256 "$SHA_LIN_X64"
              end
            end

            def install
              bin.install "cucco"
              generate_completions_from_executable(bin/"cucco", "completions")
            end

            test do
              assert_match "cucco", shell_output("#{bin}/cucco --help")
            end
          end
          EOF
          cat tap/Formula/cucco.rb

      - name: Commit and push formula
        run: |
          cd tap
          git config user.name "veeso"
          git config user.email "christian.visintin@veeso.dev"
          git add Formula/cucco.rb
          git commit -m "cucco $VERSION"
          git push
