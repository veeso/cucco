<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Install cucco</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.6;
        margin: 0 auto;
        max-width: 44rem;
        padding: 2rem 1rem;
      }
      pre {
        background: rgba(127, 127, 127, 0.12);
        border-radius: 6px;
        overflow-x: auto;
        padding: 0.75rem 1rem;
      }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <h1>cucco</h1>
    <p>
      An interactive CLI for creating
      <a href="https://www.conventionalcommits.org">conventional commits</a>,
      with git hooks support.
    </p>

    <h2>Linux and macOS</h2>
    <pre><code>curl -sSLf https://veeso.github.io/cucco/install.sh | sh</code></pre>

    <h2>Windows</h2>
    <pre><code>irm https://veeso.github.io/cucco/install.ps1 | iex</code></pre>

    <h2>Homebrew</h2>
    <pre><code>brew install veeso/cucco/cucco</code></pre>

    <p>
      <a href="https://github.com/veeso/cucco">Source</a> &middot;
      <a href="https://github.com/veeso/cucco/releases">Releases</a>
    </p>
  </body>
</html>
